<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Diary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>News Diary</h1>
    <p class="tagline">What I'm reading, and what it adds up to.</p>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="picks">Today's Picks</button>
      <button role="tab" data-tab="library">Library</button>
      <button role="tab" data-tab="diary">Diary</button>
    </nav>
  </header>

  <main>
    <section id="picks" class="panel" role="tabpanel"></section>
    <section id="library" class="panel" role="tabpanel"></section>
    <section id="diary" class="panel" role="tabpanel"></section>
  </main>

  <footer class="site-footer">
    Headlines and summaries come from each publisher's public RSS feed. Click a headline to read the full article on their site.
  </footer>

  <!-- Data files (updated by Claude) -->
  <script src="data/picks.js"></script>
  <script src="data/library.js"></script>
  <script src="data/diary.js"></script>
  <!-- The code that shows the data -->
  <script src="app.js"></script>
</body>
</html>
